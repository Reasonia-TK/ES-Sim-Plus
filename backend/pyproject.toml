[project]
name = "es-sim"
version = "0.1.0"
description = "2D sketch CAD + electrostatic FEM / particle / PIC simulation backend"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gmsh>=4.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # 粒子カーネル (walk/デポジット/gather+push) の JIT 高速化 (prompts/76)。
    # optional 依存として扱う (import 失敗時は numpy 実装へ自動フォールバックする、
    # es_sim/_numba_kernels.py 参照) が、配布版には常に同梱して既定で有効にする
    "numba>=0.59",
    # 電子 Boltzmann ソルバー (伝播演算子法)。LMEA 流体係数テーブル生成 (prompts/117、
    # es_sim/boltz.py) に使う。PyPI 未公開のためリポジトリを直接指定する
    # (release.yml の `pip install -e .` が git 依存を解決する)
    "boltzpm @ git+https://github.com/Syb04/boltzpm.git",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]  # NVIDIA CUDA 12.x / Windows ネイティブ動作
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["es_sim*"]
