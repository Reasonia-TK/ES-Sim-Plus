# ES-Sim 配布ビルド (Windows インストーラ) — GitHub Actions (prompts/133 P8d)
#
# トリガー:
#   - `v*` タグの push (例: v0.2.0。ui/src-tauri/tauri.conf.json の version と同じにする) → ビルドして GitHub Release に添付
#   - 手動実行 (workflow_dispatch) → ビルドして Artifacts にのみ保存 (Release は作らない)
#
# 手順は scripts/build_app.ps1 と同じ: uv で backend の venv (gpu・依存グループ dist = PyInstaller と NVRTC の wheel)
#   → PyInstaller の onedir と自己テスト → 第三者の使用許諾 → Tauri (tauri.bundle.json を重ねてバックエンドを
#   リソースに同梱) → NSIS のインストーラ → scripts/verify_installer.ps1 -NoGpu (一時フォルダへ黙ってインストール、
#   同梱のバックエンドの自己テスト、アプリを起動して UI から静電場、閉じてバックエンドが残らない、アンインストール)。
# GitHub のランナーには GPU が無いので GPU の確認はしない。GPU のある PC で scripts/verify_installer.ps1 を走らせる。
# 署名はしていない (prompts/133)。する場合は ES_SIM_SIGN_SCRIPT (scripts/build_backend.ps1 を参照) を用意する。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # Release 作成に必要

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content ui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$ver") { throw "タグ $env:GITHUB_REF_NAME と tauri.conf.json の version ($ver) が違います" }

      # ---- バックエンド (uv の venv。Python はランナーの 3.13) ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Backend venv (gpu + dist)
        working-directory: backend
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: uv sync --python 3.13 --extra gpu --group dist

      # ---- フロントエンドと Tauri ----
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: npm ci
        working-directory: ui
        run: npm ci

      # ---- ビルド (バックエンド → 自己テスト → 使用許諾 → Tauri → インストーラ) と確認 ----
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build_app.ps1
      - name: Verify the installer (CPU)
        shell: pwsh
        run: ./scripts/verify_installer.ps1 -NoGpu
      - name: Collect logs on failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path failure-logs | Out-Null
          Copy-Item "$env:APPDATA/com.tk.es-sim/backend.log" failure-logs/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse ui/test-results failure-logs/ -ErrorAction SilentlyContinue
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: es-sim-release-logs
          path: failure-logs/
          if-no-files-found: ignore

      # ---- 成果物 ----
      - name: Collect the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Copy-Item ui/src-tauri/target/release/bundle/nsis/*-setup.exe release-out/
          Copy-Item ui/src-tauri/target/licenses/THIRD_PARTY_NOTICES.txt release-out/
          Get-ChildItem release-out
      - uses: actions/upload-artifact@v4
        with:
          name: es-sim-windows-installer
          path: release-out/*
      - name: Create GitHub Release (tag push のみ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*
          generate_release_notes: true
