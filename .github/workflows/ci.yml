# ES-Sim CI — push / PR ごとにテストとビルド検証を実行する
name: ci

on:
  push:
    branches: [main, v2-rebuild]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install gmsh system libs
        run: sudo apt-get update && sudo apt-get install -y -q libglu1-mesa libxft2 libxrender1 libxext6 libx11-6 libgl1 libxcursor1 libxinerama1
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -q

  # UI v2 (ui/、Tauri のフロントエンド): 型検査・単体テスト (Vitest)・ビルド
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        working-directory: ui
        run: npm ci
      - name: Type check + unit tests + build
        working-directory: ui
        run: |
          npm run typecheck
          npx vitest run
          npx vite build

  # UI v2 の E2E (Playwright): 実物のバックエンドと UI の開発サーバを立てて操作する
  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install gmsh system libs
        run: sudo apt-get update && sudo apt-get install -y -q libglu1-mesa libxft2 libxrender1 libxext6 libx11-6 libgl1 libxcursor1 libxinerama1
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci + Playwright Chromium
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        working-directory: ui
        env:
          E2E_PYTHON: python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
